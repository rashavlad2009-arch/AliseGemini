<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AliseGemini Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .chat-container {
      width: 100%;
      max-width: 680px;
      height: 90vh;
      background-color: #1e1e1e;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    header {
      padding: 16px 20px;
      background-color: #252525;
      font-weight: 600;
      font-size: 1.1rem;
      border-bottom: 1px solid #333;
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 16px;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background-color: #2563eb;
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .message.bot {
      align-self: flex-start;
      background-color: #2d2d2d;
      color: #e5e5e5;
      border-bottom-left-radius: 2px;
    }

    .message.error {
      background-color: #7f1d1d;
      color: #fca5a5;
    }

    form {
      display: flex;
      padding: 16px;
      background-color: #252525;
      border-top: 1px solid #333;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #444;
      border-radius: 8px;
      background-color: #1a1a1a;
      color: #fff;
      outline: none;
      font-size: 0.95rem;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
    }

    button {
      padding: 12px 20px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    button:hover:not(:disabled) {
      background-color: #1d4ed8;
    }

    button:disabled {
      background-color: #4b5563;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <header>AliseGemini</header>
    <div class="chat-box" id="chatBox">
      <div class="message bot">Привет! Чем могу помочь?</div>
    </div>
    <form id="chatForm">
      <input type="text" id="userInput" placeholder="Напишите сообщение..." autocomplete="off" required>
      <button type="submit" id="sendBtn">Отправить</button>
    </form>
  </div>

  <script src="index.js"></script>
</body>
</html>
